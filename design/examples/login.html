<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sarmg login fixture</title>
    <link rel="stylesheet" href="/dist/design/bundle.css">
    <style>body { margin: 0; }</style>
  </head>
  <body class="sarmg-theme sarmg-login" data-sarmg-scope data-sarmg-theme="light">
    <form class="sarmg-card sarmg-login__card" aria-label="登录测试">
      <div class="sarmg-card__inner">
        <div class="sarmg-card__row"><label class="sarmg-card__label" for="user"><span class="sarmg-login__label-icon" aria-hidden="true">◇</span>账号</label><div class="sarmg-card__content"></div></div>
        <div class="sarmg-card__row sarmg-login__input-row"><div class="sarmg-card__content"><input class="sarmg-login__input" id="user" value="administrator"></div></div>
        <div class="sarmg-card__row"><label class="sarmg-card__label" for="password"><span class="sarmg-login__label-icon" aria-hidden="true">◇</span>密码</label><div class="sarmg-card__content"></div></div>
        <div class="sarmg-card__row sarmg-login__input-row"><div class="sarmg-card__content"><input class="sarmg-login__input" id="password" type="password" value="not-a-secret"></div></div>
        <div class="sarmg-card__row sarmg-login__error-row"><div class="sarmg-card__content"><span class="sarmg-login__error">示例错误消息</span></div></div>
        <div class="sarmg-card__row"><span class="sarmg-card__label">操作</span><div class="sarmg-card__content"><div class="sarmg-card__actions"><button class="sarmg-card__action sarmg-action-primary" type="submit">登录</button></div></div></div>
      </div>
    </form>
  </body>
</html>
